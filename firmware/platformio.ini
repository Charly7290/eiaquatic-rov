; AquaBot USB 2026 — firmware ESP32
;
;   pio run -e rov -t upload        -> competencia (enlace RS-485 por Serial2)
;   pio run -e rov_usb -t upload    -> banco (enlace por el USB de la devboard)
;   pio run -e bringup -t upload    -> pruebas de integración (menú por monitor serial)
;   pio device monitor              -> monitor serial a 115200
;
; DevKit V1 (DOIT, competencia) es la placa por defecto. Para DevKitC V4 use el env rov_v4.

[platformio]
default_envs = rov

[env]
platform = espressif32@6.9.0          ; core Arduino-ESP32 2.0.17 (API LEDC 2.x)
framework = arduino
board = esp32doit-devkit-v1
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_flags = -Wall

[env:rov]
build_src_filter = +<*> -<main_bringup.cpp>

[env:rov_usb]
build_src_filter = +<*> -<main_bringup.cpp>
build_flags = ${env.build_flags} -DLINK_USB=1

[env:rov_v4]
board = esp32dev
build_src_filter = +<*> -<main_bringup.cpp>

[env:bringup]
build_src_filter = +<*> -<main_rov.cpp>
